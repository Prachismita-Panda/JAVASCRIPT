<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <label for="first">Enter first number</label>
        <input type="number" id="first" />
    </div>
    <div>
        <label for="second">Enter second number</label>
        <input type="number" id="second" />
    </div>
    <button onclick="add()">Addition</button>
    <p id="result"></p>

    <script>
        function add(){
             
            const num1 = parseInt(document.querySelector("#first").value);
            console.log("First number = ",num1);
            const num2 = parseInt(document.querySelector("#second").value);
            console.log("Second number = ",num2);
            var sum = num1 + num2;
            document.querySelector("#result").innerText ="Sum is " +sum  ;


        }

    </script>
</body>
</html>
